name: CodeQL

# GitHub's code scanner. It looks for security bugs in our own code (unsafe
# HTML, injection and so on) rather than in dependencies, which the Security
# workflow's audit covers. Results appear under the repository's Security tab.

on:
  push:
    branches: [main]
  pull_request:
  # Also by hand: the release workflow starts it on the release branch, where
  # pull requests made with the workflow's token don't start workflows.
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
