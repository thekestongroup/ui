name: Release PR

# Keeps a "Release vX" pull request up to date with every changeset waiting on
# main. Nothing is released by this: it only proposes the new version
# (package.json and CHANGELOG.md, with the changesets used up). Merging that
# pull request is the release: tag-release.yml then tags it, creates the GitHub
# Release and stages it on npm.
#
# Runs whenever changesets reach main, and by hand: Actions → Release PR → Run
# workflow. With no changesets waiting it closes any open release PR.
#
# The pull request is made with the workflow's token, and pull requests made
# that way don't start other workflows. The required checks are therefore
# started here by hand (security.yml and codeql.yml, on the release branch), so
# they report on the pull request. Needs Settings → Actions → General → "Allow
# GitHub Actions to create and approve pull requests".

on:
  push:
    branches: [main]
    paths: ['.changeset/**']
  workflow_dispatch:

permissions:
  contents: write # push the release branch
  pull-requests: write # open and update the pull request
  actions: write # start the checks on the release branch

# One at a time, so two quick merges don't race to update the branch.
concurrency:
  group: release-pr
  cancel-in-progress: false

env:
  BRANCH: changeset-release/main

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check for changes to release
        id: pending
        run: |
          if find .changeset -name '*.md' ! -name README.md | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No changesets waiting, so no release pull request." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Nothing to release (e.g. the release pull request was just merged):
      # close a release PR that is still open.
      - name: Close a stale release pull request
        if: steps.pending.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close "$BRANCH" --delete-branch --comment "No changesets are waiting any more." || true

      - name: Setup pnpm
        if: steps.pending.outputs.found == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node
        if: steps.pending.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.pending.outputs.found == 'true'
        run: pnpm install --frozen-lockfile

      # Don't propose a release that doesn't build or pass its tests.
      - name: Test and build
        if: steps.pending.outputs.found == 'true'
        run: |
          pnpm test
          pnpm build

      - name: Version
        if: steps.pending.outputs.found == 'true'
        id: version
        run: |
          pnpm changeset version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # This version's changelog entry, for the pull request description.
          awk -v v="## $VERSION" '$0 == v {found=1; next} found && /^## / {exit} found' CHANGELOG.md > release-notes.md

      - name: Push the release branch
        if: steps.pending.outputs.found == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add package.json CHANGELOG.md .changeset
          git commit -m "Release v$VERSION"
          git push --force origin "$BRANCH"

      - name: Open or update the pull request
        if: steps.pending.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            cat release-notes.md
            echo
            echo "---"
            echo "Merging this releases v$VERSION: it is tagged, a GitHub Release is created and it is staged on npm (approve it on npmjs.com to make it live)."
          } > pr-body.md
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "Release v$VERSION" --body-file pr-body.md
          else
            gh pr create --base main --head "$BRANCH" --title "Release v$VERSION" --body-file pr-body.md
          fi

      # Required checks only count if they ran on the branch's latest commit.
      - name: Start the required checks
        if: steps.pending.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run security.yml --ref "$BRANCH"
          gh workflow run codeql.yml --ref "$BRANCH"
