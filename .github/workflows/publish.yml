name: Publish

# Stages the version in package.json on npm (trusted publishing: npm trusts
# this file by name, so keep it called publish.yml). Started by release.yml
# on the new version's tag; run it by hand on a tag to retry. Skips a version
# that's already on npm.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upgrade npm (for staged publishing)
        run: npm install -g npm@latest

      - name: Check if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@thekestongroup/ui@${VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already published - skipping stage"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage publish
        if: steps.check.outputs.already_published == 'false'
        run: npm stage publish
