name: Security

# Checks the production dependencies for known vulnerabilities. Runs on every
# pull request and push to main, and once a week so a vulnerability disclosed
# later still shows up. Read-only: it changes and publishes nothing.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      # Fails on high or critical findings in what the library ships to people.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
